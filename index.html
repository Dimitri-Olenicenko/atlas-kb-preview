<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База знаний проекта</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<style>
:root{--paper:#fff;--ink:#16223a;--ink2:#48607f;--ink3:#8296b0;--line:#e3e9f2;
  --violet:#6b4fbb;--red:#bf3a3a;--redbg:#fdeded;
  --sans:'Segoe UI',system-ui,-apple-system,sans-serif;--mono:Consolas,'SF Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:linear-gradient(150deg,#0d1526,#182741 60%,#1f3055);
  color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
.gate{background:var(--paper);border-radius:18px;padding:38px 36px 30px;max-width:430px;width:100%;
  box-shadow:0 26px 70px rgba(0,0,0,.42);text-align:center}
.lock{font-size:40px;margin-bottom:14px;display:block}
h1{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
.sub{font-size:13.5px;color:var(--ink2);line-height:1.55;margin-bottom:24px}
.f{display:flex;flex-direction:column;gap:11px}
input{width:100%;background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:13px 15px;
  font-size:15px;font-family:inherit;color:var(--ink);outline:none;transition:.15s;text-align:center;letter-spacing:.04em}
input:focus{border-color:var(--violet);box-shadow:0 0 0 3px #f3f0fc}
button{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:13px 18px;font-size:14.5px;
  font-weight:680;cursor:pointer;font-family:inherit;transition:.15s}
button:hover{background:var(--violet)}
button:disabled{opacity:.55;cursor:default}
.err{background:var(--redbg);border:1px solid #f0cfcf;color:#8f2e2e;border-radius:9px;
  padding:10px 13px;font-size:12.5px;margin-top:12px;display:none}
.err.on{display:block}
.busy{display:none;font-size:12.5px;color:var(--ink2);margin-top:12px}
.busy.on{display:block}
.hint{font-size:11.5px;color:var(--ink3);margin-top:18px;line-height:1.5}

/* after unlock */
#app{display:none;position:fixed;inset:0;background:#f7f9fc}
#app.on{display:block}
#appf{width:100%;height:100%;border:0;display:block}
#ov{display:none;position:fixed;inset:0;background:#fff;z-index:900}
#ov.on{display:block}
#ovf{width:100%;height:100%;border:0;display:block}
.back{position:fixed;top:16px;left:16px;z-index:950;background:rgba(22,34,58,.94);color:#fff;border:none;
  border-radius:99px;padding:10px 18px;font-size:13px;font-weight:680;cursor:pointer;font-family:var(--sans);
  box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;align-items:center;gap:7px}
.back.on{display:inline-flex}
.back:hover{background:var(--violet)}
</style>
</head>
<body>

<div class="gate" id="gate">
  <span class="lock">🔒</span>
  <h1>База знаний проекта</h1>
  <p class="sub">Материалы защищены паролем.<br>Введите пароль — откроется всё сразу.</p>
  <form class="f" id="form" autocomplete="off">
    <input type="password" id="pw" placeholder="Пароль" autofocus autocomplete="off" spellcheck="false">
    <button type="submit" id="btn">Открыть</button>
  </form>
  <div class="err" id="err">Неверный пароль. Попробуйте ещё раз.</div>
  <div class="busy" id="busy">Расшифровка…</div>
  <p class="hint">Конфиденциально. Не пересылайте ссылку вместе с паролем.</p>
</div>

<div id="app"><iframe id="appf" title="overview"></iframe></div>
<button class="back" id="back">← Назад к обзору</button>
<div id="ov"><iframe id="ovf" title="content"></iframe></div>

var PAGES = null;

function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}

async function unlock(pw){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

// open an inner page in the overlay — already decrypted, no second prompt
window.openPage=function(which){
  if(!PAGES) return;
  var f=document.getElementById('ovf');
  f.srcdoc = PAGES[which];
  document.getElementById('ov').classList.add('on');
  document.getElementById('back').classList.add('on');
};
document.getElementById('back').onclick=function(){
  document.getElementById('ov').classList.remove('on');
  document.getElementById('back').classList.remove('on');
  document.getElementById('ovf').srcdoc='';
};
document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && document.getElementById('ov').classList.contains('on')){
    document.getElementById('back').click();
  }
});

document.getElementById('form').addEventListener('submit',async function(e){
  e.preventDefault();
  var pw=document.getElementById('pw').value;
  if(!pw) return;
  var err=document.getElementById('err'), busy=document.getElementById('busy'), btn=document.getElementById('btn');
  err.classList.remove('on'); busy.classList.add('on'); btn.disabled=true;
  try{
    PAGES=await unlock(pw);
    document.getElementById('gate').style.display='none';
    document.body.style.background='#f7f9fc';
    document.body.style.display='block';
    document.body.style.padding='0';
    document.getElementById('appf').srcdoc=PAGES.landing;
    document.getElementById('app').classList.add('on');
  }catch(ex){
    busy.classList.remove('on'); btn.disabled=false;
    err.classList.add('on');
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
});
</script>
